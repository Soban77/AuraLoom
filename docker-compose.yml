services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-loom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura_loom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - aura_loom_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aura_loom"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  aura_loom_data:
